<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade & GPA Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>🎓 Student Grade & GPA Calculator</h1>
    <p>System Analysis & Design - Team Performance Task</p>
  </header>

  <main class="container">

    <!-- MEMBER 1 FEATURE: Subject Input Form -->
    <section class="card" id="input-section">
      <h2>1. Add Subject & Grade</h2>
      <div class="input-group">
        <label for="subject-name">Subject Name:</label>
        <input type="text" id="subject-name" placeholder="e.g. System Analysis & Design">
      </div>
      <div class="input-group">
        <label for="subject-units">Units:</label>
        <input type="number" id="subject-units" min="1" max="5" placeholder="e.g. 3">
      </div>
      <div class="input-group">
        <label for="subject-grade">Total Grade (%):</label>
        <input type="number" id="subject-grade" min="0" max="100" step="0.01" placeholder="e.g. 92.5">
      </div>
      <button id="add-subject-btn">Add Subject</button>
    </section>

    <!-- MEMBER 2 FEATURE: Subjects Table List -->
    <section class="card" id="table-section">
      <h2>2. Enrolled Subjects</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Subject</th>
              <th>Units</th>
              <th>Total Grade</th>
              <th>Equivalent</th>
            </tr>
          </thead>
          <tbody id="subject-list">
            <!-- Dynamic rows will appear here -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- MEMBER 3 FEATURE: GPA Summary & Academic Status -->
    <section class="card" id="summary-section">
      <h2>3. Academic Summary</h2>
      <div class="summary-box">
        <p>Total Units: <span id="total-units">0</span></p>
        <p>Computed GPA: <span id="computed-gpa">0.00</span></p>
        <p>Academic Status: <span id="academic-status" class="badge">No Data</span></p>
      </div>
      <button id="clear-all-btn" class="btn-danger">Clear All Data</button>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 SAD Midterm Team Workflow Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
